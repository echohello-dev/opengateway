<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" role="img" aria-label="OpenGateway"><style>svg{--c:#EDEBE6;--o:#FF5A1F}.m-draw-arch{fill:none;stroke:var(--c);stroke-width:4.358;stroke-linecap:round;stroke-linejoin:round}.m-draw-dot{fill:var(--o)}.m-draw-arch{stroke-dasharray:1 3;animation:m-draw-draw 900ms cubic-bezier(0.77,0,0.175,1) 100ms backwards}.m-draw-dot{transform-box:fill-box;transform-origin:center;animation:m-draw-pop 420ms cubic-bezier(0.34,1.56,0.64,1) 860ms backwards}@keyframes m-draw-draw{from{stroke-dashoffset:1.06}to{stroke-dashoffset:0}}@keyframes m-draw-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m-draw-mark"><path class="m-draw-arch" pathLength="1" d="M6.769 26.321V14.910a9.231 9.231 0 0 1 18.462 0V16.575"/><circle class="m-draw-dot" cx="25.231" cy="24.974" r="3.526"/></g></svg>
