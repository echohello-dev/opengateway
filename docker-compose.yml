services:
  gateway:
    build: .
    image: opengateway:mojo
    ports:
      - "8080:8080"
    environment:
      # Provider keys + auth — read by opengateway.mojo_bridge.
      - ROOT_KEY=${ROOT_KEY:-sk-root-change-me}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Persistence + distributed state. Unset these to run
      # root-key-only with per-process rate limiting.
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/opengateway
      - REDIS_URL=redis://redis:6379/0
      # Process-level admission gate (0 = disabled).
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-0}
    depends_on:
      - db
      - redis
    networks:
      - gateway
    # Override the entrypoint for local dev (mount source, no rebuild):
    #   entrypoint: ["python", "-m", "opengateway"]
    #   volumes:
    #     - ./opengateway:/app/opengateway
    #   environment:
    #     - PYTHONPATH=/app

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=opengateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gateway

  redis:
    image: redis:7-alpine
    networks:
      - gateway

volumes:
  postgres_data:

networks:
  gateway:
    driver: bridge